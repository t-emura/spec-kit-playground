name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # FR-006: manual trigger for dry-run validation before a real release.
  # workflow_dispatch always builds without publishing (inherently a dry run).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build binaries without publishing to GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Pre-create a Draft GitHub Release BEFORE matrix builds start.
  # This eliminates the race condition where multiple matrix jobs try to
  # create the same release simultaneously, causing 422 errors.
  create-draft:
    # Only create a release for real tag pushes (not workflow_dispatch dry runs).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft GitHub Release
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — skipping draft creation"
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --draft \
              --generate-notes \
              --repo "${{ github.repository }}"
            echo "Draft release ${{ github.ref_name }} created"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Run after create-draft (which may be skipped for workflow_dispatch).
    needs: create-draft
    # always() so this job runs even when create-draft was skipped (workflow_dispatch).
    if: always() && (needs.create-draft.result == 'success' || needs.create-draft.result == 'skipped')
    strategy:
      # FR-008: fail-fast prevents partial releases if one platform build fails
      fail-fast: true
      # FR-002: each OS gets its own runner for native module compatibility
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native

      - name: Build
        run: npm run build

      # For tag pushes: upload to the pre-created Draft release.
      # For workflow_dispatch: build only, no publish (always a dry run).
      # FR-005: release title includes version — electron-builder uses tag name automatically
      # FR-007: version embedded in binary — electron-builder reads package.json#version
      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish ${{ github.event_name == 'push' && 'always' || 'never' }}

      # T005/T011: upload artifacts for workflow_dispatch runs (dry-run validation)
      - name: Upload artifacts (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: electron-artifacts-${{ matrix.os }}
          path: |
            dist-electron/**/*.dmg
            dist-electron/**/*.exe
            dist-electron/**/*.AppImage
          if-no-files-found: warn

      # T012: workflow summary for immediate build feedback
      - name: Workflow summary
        shell: bash
        run: |
          echo "## Build Summary — ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "| Mode | 🚀 Published to GitHub Release |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Mode | 🧪 Dry run (workflow_dispatch — artifacts uploaded, not published) |" >> "$GITHUB_STEP_SUMMARY"
          fi
          ARTIFACTS=$(find dist-electron -maxdepth 2 \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \) 2>/dev/null | while read f; do basename "$f"; done | tr '\n' ' ')
          echo "| Artifacts | ${ARTIFACTS:-none found} |" >> "$GITHUB_STEP_SUMMARY"

  # After all matrix builds upload their artifacts, publish the Draft release.
  publish-release:
    needs: build
    if: github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        run: |
          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --repo "${{ github.repository }}"
          echo "✅ Release ${{ github.ref_name }} published"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workflow summary
        run: |
          echo "## Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ GitHub Release [\`${{ github.ref_name }}\`](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) is now public." >> "$GITHUB_STEP_SUMMARY"
