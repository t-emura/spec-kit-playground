appId: io.github.t-emura.modern-ai-outliner
productName: Modern AI Outliner

directories:
  output: dist-electron

files:
  - apps/electron/dist/**/*
  - package.json

# T001: Extract better-sqlite3 native .node files outside the asar archive.
# Native modules cannot be loaded from inside asar — without this the app crashes on launch.
asarUnpack:
  - "**/better-sqlite3/**"

extraResources:
  - from: apps/web/dist
    to: public
    filter:
      - "**/*"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64

publish:
  provider: github
  # T002: publish as a full Release (not a Draft) so users can download immediately
  releaseType: release
